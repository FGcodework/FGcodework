<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 210" width="290" height="210" role="img" aria-label="FG Favicon Manager — favicons and PWA icons for Joomla 5 and 6 in one plugin.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14264a"/><stop offset="1" stop-color="#0b1426"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc3ff"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
  </defs>
  <rect width="290" height="210" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="289" height="209" rx="17.5" fill="none" stroke="#2a4276"/>
  <rect x="20" y="20" width="46" height="46" rx="12" fill="#0a1226" stroke="#4cc3ff" stroke-opacity="0.45"/>
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43 29l4.2 8.6 9.4 1.3-6.8 6.6 1.6 9.4-8.4-4.4-8.4 4.4 1.6-9.4-6.8-6.6 9.4-1.3z"/>
  </g>
  <text x="78" y="40" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#7f93bb" letter-spacing="2">PLUGIN</text>
  <text x="78" y="60" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f6ff">Favicon Manager</text>
  <text x="20" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#b8c7e6">Favicons and PWA icons for your</text>
  <text x="20" y="119" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#b8c7e6">site, set up once in the plugin —</text>
  <text x="20" y="138" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#b8c7e6">no template hacking required.</text>
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="11" fill="#cfe3ff">
    <g transform="translate(20 164)"><rect width="76" height="24" rx="12" fill="#4cc3ff" fill-opacity="0.12" stroke="#4cc3ff" stroke-opacity="0.5"/><text x="38" y="16" text-anchor="middle">Joomla 5/6</text></g>
    <g transform="translate(106 164)"><rect width="74" height="24" rx="12" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-opacity="0.55"/><text x="37" y="16" text-anchor="middle" fill="#ffe2b8">Released</text></g>
  </g>
</svg>
