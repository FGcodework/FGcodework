    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc3ff"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
  </defs>
  <rect width="290" height="210" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="289" height="209" rx="17.5" fill="none" stroke="#2a4276"/>
  <rect x="20" y="20" width="46" height="46" rx="12" fill="#0a1226" stroke="#4cc3ff" stroke-opacity="0.45"/>
