<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
  <title id="t">FGcodework — Joomla extensions &amp; tools</title>
  <desc id="d">Independent developer building native Joomla 5 and 6 extensions, plugins and admin tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#14264a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc3ff"/>
      <stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3566"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#4cc3ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="260" rx="22" fill="url(#bg)"/>
  <rect width="900" height="260" rx="22" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="21.5" fill="none" stroke="#2a4276" stroke-opacity="0.8"/>

  <!-- logo tile -->
  <g transform="translate(60 62)">
    <rect width="136" height="136" rx="32" fill="url(#tile)" stroke="#4cc3ff" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="4" y="4" width="128" height="60" rx="28" fill="#ffffff" fill-opacity="0.05"/>
    <text x="68" y="88" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="url(#accent)" letter-spacing="-2">FG</text>
    <text x="68" y="112" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8fa6d1" letter-spacing="3">&lt;/&gt;</text>
  </g>

  <!-- text -->
  <text x="232" y="106" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="#f2f6ff" letter-spacing="-1">FGcodework</text>
  <rect x="234" y="120" width="86" height="4" rx="2" fill="url(#accent)"/>
  <text x="232" y="156" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#b8c7e6">Native Joomla extensions, plugins &amp; admin tools.</text>
  <text x="232" y="184" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#7f93bb">Built for Joomla 5 and 6 — small, fast, no bloat.</text>

  <!-- chips -->
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#cfe3ff">
    <g transform="translate(232 204)"><rect width="92" height="26" rx="13" fill="#4cc3ff" fill-opacity="0.12" stroke="#4cc3ff" stroke-opacity="0.5"/><text x="46" y="17" text-anchor="middle">Joomla 5/6</text></g>
    <g transform="translate(334 204)"><rect width="64" height="26" rx="13" fill="#4cc3ff" fill-opacity="0.12" stroke="#4cc3ff" stroke-opacity="0.5"/><text x="32" y="17" text-anchor="middle">PHP 8</text></g>
    <g transform="translate(408 204)"><rect width="92" height="26" rx="13" fill="#ffb454" fill-opacity="0.12" stroke="#ffb454" stroke-opacity="0.55"/><text x="46" y="17" text-anchor="middle" fill="#ffe2b8">Open source</text></g>
  </g>

  <!-- decorative brackets -->
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" fill="#4cc3ff" fill-opacity="0.16" font-size="150" font-weight="700">
    <text x="700" y="190">{ }</text>
  </g>
</svg>
