<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Fero — developer and IT administrator. Focus: Joomla extensions, PHP, SQL. Based in Slovakia.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc3ff"/><stop offset="1" stop-color="#ff7a4d"/></linearGradient>
    <clipPath id="clip"><rect width="900" height="150" rx="18"/></clipPath>
  </defs>
  <rect width="900" height="150" rx="18" fill="#0d172b"/>
  <rect x="0.5" y="0.5" width="899" height="149" rx="17.5" fill="none" stroke="#2a4276" stroke-opacity="0.8"/>
  <rect x="0" y="26" width="5" height="98" fill="url(#accent)" clip-path="url(#clip)"/>

  <text x="40" y="52" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#7f93bb" letter-spacing="3">ABOUT</text>
  <text x="40" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f2f6ff">Fero — developer &amp; IT administrator</text>
  <text x="40" y="118" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#b8c7e6">I build the Joomla tools I wish existed — then keep them small, native and maintainable.</text>

  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12">
    <text x="736" y="52" fill="#7f93bb" letter-spacing="2">FOCUS</text>
    <text x="736" y="72" fill="#dbe7ff">Joomla · PHP · SQL</text>
    <text x="736" y="100" fill="#7f93bb" letter-spacing="2">BASED IN</text>
    <text x="736" y="120" fill="#dbe7ff">Slovakia</text>
  </g>
</svg>
