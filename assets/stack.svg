<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="Stack — web: Joomla, PHP, JavaScript; data: MS SQL Server, T-SQL, MySQL; tooling: Python, Git, GitHub, Windows administration">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4cc3ff"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
  </defs>
  <rect width="900" height="190" rx="18" fill="#0d172b"/>
  <rect x="0.5" y="0.5" width="899" height="189" rx="17.5" fill="none" stroke="#2a4276" stroke-opacity="0.8"/>
  <style>
    .h{font:600 12px SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#7f93bb;letter-spacing:3px}
    .c{font:13px SFMono-Regular,Consolas,'Liberation Mono',monospace;fill:#dbe7ff}
    .p{fill:#4cc3ff;fill-opacity:.1;stroke:#4cc3ff;stroke-opacity:.4}
  </style>

  <text x="36" y="40" class="h">STACK</text>
  <rect x="36" y="48" width="40" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- web -->
  <text x="36" y="82" class="h" style="fill:#ffb454">WEB</text>
  <g transform="translate(120 64)">
    <rect class="p" width="84" height="26" rx="13"/><text class="c" x="42" y="17" text-anchor="middle">Joomla</text>
  </g>
  <g transform="translate(214 64)">
    <rect class="p" width="60" height="26" rx="13"/><text class="c" x="30" y="17" text-anchor="middle">PHP</text>
  </g>
  <g transform="translate(284 64)">
    <rect class="p" width="104" height="26" rx="13"/><text class="c" x="52" y="17" text-anchor="middle">JavaScript</text>
  </g>

  <!-- data -->
  <text x="36" y="122" class="h" style="fill:#ffb454">DATA</text>
  <g transform="translate(120 104)">
    <rect class="p" width="132" height="26" rx="13"/><text class="c" x="66" y="17" text-anchor="middle">MS SQL Server</text>
  </g>
  <g transform="translate(262 104)">
    <rect class="p" width="76" height="26" rx="13"/><text class="c" x="38" y="17" text-anchor="middle">T-SQL</text>
  </g>
  <g transform="translate(348 104)">
    <rect class="p" width="76" height="26" rx="13"/><text class="c" x="38" y="17" text-anchor="middle">MySQL</text>
  </g>

  <!-- tooling -->
  <text x="36" y="162" class="h" style="fill:#ffb454">TOOLS</text>
  <g transform="translate(120 144)">
    <rect class="p" width="76" height="26" rx="13"/><text class="c" x="38" y="17" text-anchor="middle">Python</text>
  </g>
  <g transform="translate(206 144)">
    <rect class="p" width="60" height="26" rx="13"/><text class="c" x="30" y="17" text-anchor="middle">Git</text>
  </g>
  <g transform="translate(276 144)">
    <rect class="p" width="84" height="26" rx="13"/><text class="c" x="42" y="17" text-anchor="middle">GitHub</text>
  </g>
  <g transform="translate(370 144)">
    <rect class="p" width="156" height="26" rx="13"/><text class="c" x="78" y="17" text-anchor="middle">Windows admin</text>
  </g>

  <!-- decorative -->
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="120" font-weight="700" fill="#4cc3ff" fill-opacity="0.08">
    <text x="640" y="150">&lt;/&gt;</text>
  </g>
</svg>
